<?xml version="1.0" encoding="UTF-8"?>
<!-- disktiles: an uneven treemap mosaic in .NET purple on Tokyo Night navy;
     the striped amber tile is the one you can reclaim. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3549"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
    <pattern id="reclaimable" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e0af68"/>
      <rect width="3.5" height="8" fill="#b5803f"/>
    </pattern>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#night)"/>
  <rect x="28" y="28" width="58" height="104" rx="5" fill="#9780e5"/>
  <rect x="92" y="28" width="40" height="58" rx="5" fill="#c3b6f2"/>
  <rect x="92" y="92" width="18" height="40" rx="4" fill="#512bd4"/>
  <rect x="116" y="92" width="16" height="40" rx="4" fill="url(#reclaimable)"/>
</svg>
