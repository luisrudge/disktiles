name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token, no secrets: pull requests from forks run this too.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit (tags can move); Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Formatting (.NET's defaults); the build below also fails on any
      # analyzer warning.
      - run: dotnet format disktiles.slnx --verify-no-changes
      - run: dotnet build disktiles.slnx -c Release
      - run: dotnet run --project tests/FilterTests -c Release --no-build
      # Fixtures under the temp folder only; nothing outside them is removed.
      - run: dotnet run --project tests/RemovalTests -c Release --no-build
      # Again on one core, where a scan started on the thread pool must not
      # wait for a thread the pool never gives it.
      - run: dotnet run --project tests/RemovalTests -c Release --no-build
        env:
          DOTNET_PROCESSOR_COUNT: 1
      # The single native executable: the runners carry the native toolchain.
      - run: dotnet publish src/Disktiles -c Release -o out
      - run: ls -l out && out/disktiles --version
        shell: bash
      # Windows: the exe is a GUI program with no console of its own. Started
      # with no output handles, as from a terminal, its version must still
      # reach the console it was started from.
      - if: runner.os == 'Windows'
        shell: python
        run: |
          import ctypes, subprocess
          from ctypes import wintypes

          class Coord(ctypes.Structure):
              _fields_ = [("X", wintypes.SHORT), ("Y", wintypes.SHORT)]

          class BufferInfo(ctypes.Structure):
              _fields_ = [("size", Coord), ("cursor", Coord), ("attributes", wintypes.WORD),
                          ("window", wintypes.SMALL_RECT), ("maximum", Coord)]

          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel32.CreateFileW.restype = wintypes.HANDLE
          kernel32.GetConsoleScreenBufferInfo.argtypes = [wintypes.HANDLE, ctypes.POINTER(BufferInfo)]
          kernel32.ReadConsoleOutputCharacterW.argtypes = [wintypes.HANDLE, wintypes.LPWSTR, wintypes.DWORD,
                                                           Coord, ctypes.POINTER(wintypes.DWORD)]

          # STARTF_USESTDHANDLES with every handle left empty.
          startup = subprocess.STARTUPINFO(dwFlags=subprocess.STARTF_USESTDHANDLES)
          subprocess.run([r"out\disktiles.exe", "--version"], startupinfo=startup, check=True)

          console = kernel32.CreateFileW("CONOUT$", 0xC0000000, 3, None, 3, 0, None)  # read/write, shared, existing
          info = BufferInfo()
          assert kernel32.GetConsoleScreenBufferInfo(console, ctypes.byref(info)), ctypes.get_last_error()
          length = info.size.X * (info.cursor.Y + 1)
          text, read = ctypes.create_unicode_buffer(length), wintypes.DWORD()
          assert kernel32.ReadConsoleOutputCharacterW(console, text, length, Coord(0, 0), ctypes.byref(read))
          shown = " ".join(text[:read.value].split())
          assert "disktiles " in shown, f"nothing printed to the console: {shown!r}"
          print(f"the console shows: {shown}")
